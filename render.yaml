services:
  - type: web
    name: chimall-nos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    branch: claude/car-marketplace-app-AqfD8
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: false
        value: china2024
      - key: DATABASE_URL
        value: sqlite:////app/data/cars.db
      - key: PORT
        value: 8000
